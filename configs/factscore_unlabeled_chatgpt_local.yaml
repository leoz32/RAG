project_name: rag_hallucination_eval
random_seed: 42
prompt_version: factscore_unlabeled_chatgpt_local_v1

llm:
  provider: openai_compatible
  model_name: deepseek-chat
  temperature: 0.0
  max_tokens: 800
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com

embedding:
  provider: local_hash
  model_name: local-hash-256
  dimension: 256

chunking:
  chunk_size: 700
  chunk_overlap: 120

evaluation:
  llm_max_tokens: 4096
  factscore_concurrency: 4
  factscore_enabled: true
  factscore_model_name: retrieval+ChatGPT
  factscore_gamma: 10
  factscore_openai_key_env: DEEPSEEK_API_KEY
  factscore_api_base: https://api.deepseek.com/v1
  factscore_chat_model_name: deepseek-chat
  factscore_instruct_model_name: deepseek-chat
  factscore_source_path: FActScore
  factscore_retrieval_type: bm25

retrieval:
  top_k: 4

dataset:
  kind: factscore_jsonl
  course_name: factscore_unlabeled_chatgpt
  dataset_version: v1
  qa_dataset_path: FActScore/data/unlabeled/ChatGPT.jsonl
  raw_glob: "*.md"
  exclude_globs:
    - "DATASET_SOURCE_NOTE.md"

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  eval_dir: data/eval
  vector_store_dir: data/vector_store
  results_dir: results
  runs_dir: results/runs
  reports_dir: results/reports
  figures_dir: results/figures
